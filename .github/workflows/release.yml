name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.1
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build origincheck.exe
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/OriginCheck/origincheck.exe .
          cp HOW-TO-USE.md dist/OriginCheck/
          cd dist && zip -r OriginCheck.zip OriginCheck
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="${{ inputs.tag }}"; fi
          gh release create "$TAG" dist/OriginCheck.zip --title "OriginCheck $TAG" \
            --notes "Download OriginCheck.zip, extract it, and double-click origincheck.exe. See HOW-TO-USE.md inside the zip." \
            --target "${GITHUB_SHA}"
